name: prerelease

on:
  push:
    branches: [release, hotfix]
  workflow_dispatch:

jobs:
  prerelease:
    name: Development Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for authentication using OIDC
    steps:
      - uses: actions/checkout@v7
      - name: Bump pubspec.yaml version for dev release
        run: sed -i "s/version.*/&-$GITHUB_RUN_ID/" pubspec.yaml
      - name: Bump CHANGELOG.md version for dev release
        id: changelog_reader
        run: |
          version=$(grep -m1 -oP '(?<=^## \[)[0-9][^]]*' CHANGELOG.md)
          sed -i "0,/^## \[[0-9].*/s//## [$version-$GITHUB_RUN_ID]/" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # dart-lang/setup-dart provisions the OIDC token pub.dev publishing needs;
      # its `dart` binary is shadowed by the Flutter SDK's afterward (needed to publish a Flutter plugin).
      - uses: dart-lang/setup-dart@v1
      - uses: flutter-actions/setup-flutter@v4.3
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish -f
      - name: Add entry to Github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog_reader.outputs.version }}+${{ github.run_id }}
          prerelease: true
