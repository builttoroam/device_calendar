name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for authentication using OIDC
    steps:
      - uses: actions/checkout@v7
      - name: Get Changelog Entry
        id: changelog_reader
        run: |
          version=$(grep -m1 -oP '(?<=^## \[)[0-9][^]]*' CHANGELOG.md)
          changes=$(awk '/^## \[[0-9]/{n++} n==1 && !/^## \[/{print} n==2{exit}' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      # dart-lang/setup-dart provisions the OIDC token pub.dev publishing needs;
      # its `dart` binary is shadowed by the Flutter SDK's afterward (needed to publish a Flutter plugin).
      - uses: dart-lang/setup-dart@v1
      - uses: flutter-actions/setup-flutter@v4.3
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish -f
      - name: Add entry to Github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
